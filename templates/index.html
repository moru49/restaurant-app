<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>전국 회식 맛집 추천</title>

<style>

body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial;
}

.hero{
    height:350px;
    background:url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero h1{
    color:white;
    font-size:48px;
    text-shadow:0 0 20px black;
}

.container{
    width:90%;
    margin:auto;
}

.search-box{
    background:white;
    padding:20px;
    margin-top:-50px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

select,input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:8px;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.rating{
    color:#ff9800;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="hero">
<h1>🍻 전국 회식 맛집 추천</h1>
</div>

<div class="container">

<div class="search-box">

<h2>검색 조건</h2>

<select>
<option>서울</option>
<option>경기</option>
<option>인천</option>
<option>부산</option>
<option>대구</option>
<option selected>경남</option>
</select>

<select>
<option selected>창원시</option>
<option>김해시</option>
<option>진주시</option>
</select>

<select>
<option selected>성산구</option>
<option>의창구</option>
<option>진해구</option>
</select>

<input type="text" placeholder="동 입력 (예: 상남동)">

<input type="number" placeholder="인원" value="6">

<input type="number" placeholder="인당 예산" value="50000">

<select>
<option>한식</option>
<option>일식</option>
<option>중식</option>
<option>고기</option>
<option>해산물</option>
<option>이자카야</option>
</select>

<button>맛집 찾기</button>

</div>

<h2>🔥 추천 맛집</h2>

<div class="card-grid">

{% for r in restaurants %}

<div class="card">

{{r.image}}

<div class="card-body">

<h3>{{r.name}}</h3>

<p>{{r.region}}</p>

<p>{{r.type}}</p>

<p class="rating">⭐ {{r.rating}}</p>

<p>
💰 인당
{{ "{:,}".format(r.price) }}원
</p>

<p>
👥 6명 기준 :
<b>{{ "{:,}".format(r.price*6) }}원</b>
</p>

<a
href="https://search.naver.com/search.naver?query={{r.name}}"
target="_blank">

네이버 검색

</a>

</div>

</div>

{% endfor %}

tml>
